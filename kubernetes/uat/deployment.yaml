apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
  namespace: uat
  labels:
    app: myapp
    environment: uat
spec:
  # UAT has 1 replica — just for client approval
  replicas: 1
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
        environment: uat
    spec:
      containers:
      - name: myapp
        image: nginx:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
